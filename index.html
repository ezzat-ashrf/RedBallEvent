    /* Full-page STARLIGHT sky */
    body{background:#020507}
    #starfield{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 18%,#101820 0,#05090d 32%,#010203 74%)}
    .sky-glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .sky-glow:before,.sky-glow:after{content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.16;animation:nebulaFloat 13s ease-in-out infinite alternate}
    .sky-glow:before{width:52vw;height:52vw;left:-22vw;top:8vh;background:radial-gradient(circle,rgba(224,152,31,.72),transparent 68%)}
    .sky-glow:after{width:48vw;height:48vw;right:-22vw;bottom:-10vh;background:radial-gradient(circle,rgba(255,255,255,.26),transparent 66%);animation-delay:-6s}
    .shell{background:transparent;isolation:auto;position:relative;z-index:1}
    .shell:before,.shell:after{display:none}
    header{background:linear-gradient(180deg,rgba(1,3,5,.92),rgba(1,3,5,.68));box-shadow:0 12px 45px rgba(0,0,0,.22)}
    main{padding-top:clamp(38px,7vh,88px)}
    .brand-lockup{width:min(900px,88vw);margin:0 auto clamp(52px,8vh,90px);border:0;border-radius:0;background:transparent;box-shadow:none;position:relative;overflow:visible;filter:drop-shadow(0 22px 46px rgba(0,0,0,.7))}
    .brand-lockup:after{content:"";position:absolute;inset:10% 8%;z-index:-1;background:radial-gradient(ellipse,rgba(224,152,31,.13),transparent 68%);filter:blur(25px);animation:logoAura 5s ease-in-out infinite}
    .brand-lockup img{filter:drop-shadow(0 0 14px rgba(255,255,255,.06))}
    .intro{padding:clamp(24px,4vw,42px);border-left:1px solid rgba(224,152,31,.48);background:linear-gradient(90deg,rgba(7,10,14,.82),rgba(7,10,14,.18),transparent);backdrop-filter:blur(4px)}
    .stage-card{background:linear-gradient(150deg,rgba(16,20,26,.9),rgba(5,7,10,.72));backdrop-filter:blur(12px);border-color:rgba(255,255,255,.12)}
    .stage-card:after{filter:blur(46px)}
    .lineup{backdrop-filter:blur(16px)}

    @keyframes logoAura{0%,100%{opacity:.45;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
    @media(max-width:620px){.brand-lockup{width:108%;margin-left:-4%;margin-bottom:36px}.intro{padding:22px 18px}}

    @keyframes driftingSpark{0%,100%{transform:translate3d(0,0,0) scale(.55);opacity:.2}50%{transform:translate3d(34px,-45px,0) scale(1.35);opacity:1}}
    @media(max-width:950px){#home{grid-template-rows:minmax(0,.68fr) auto minmax(0,1.32fr)}.stage-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.brand-lockup{width:min(760px,88vw)}.stage-card{padding:clamp(12px,1.8vw,20px)}}
    @media(orientation:portrait) and (min-width:621px){#home{grid-template-rows:minmax(0,.68fr) auto minmax(0,1.32fr);padding-bottom:max(10px,env(safe-area-inset-bottom))}.stage-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(14px,1.7vh,24px)}.brand-lockup{width:min(720px,78vw)}.stage-card{padding:clamp(18px,2.2vw,28px)}.stage-card h2{font-size:clamp(1.35rem,3vw,2rem)}}
    @media(max-width:620px){body:has(#home:not([style*="display: none"])) {overflow:auto}main{height:auto;min-height:100svh}#home{height:auto;min-height:100svh;display:block}.brand-lockup{width:108%;height:auto;aspect-ratio:1681/982;margin:0 0 8px -4%}.intro{margin:0 0 22px}.stage-grid{height:auto;grid-template-columns:1fr;grid-template-rows:none}.stage-card{min-height:150px!important}.schedule-headbar{grid-template-columns:auto 1fr}.schedule-logo{grid-column:2;width:min(300px,64vw);height:105px;justify-self:end}}
    @media(max-height:760px) and (min-width:621px){main{padding-top:10px;padding-bottom:10px}#home{grid-template-rows:minmax(0,.52fr) auto minmax(0,1.48fr);gap:8px}.brand-lockup{width:min(590px,66vw)}.intro h1{font-size:clamp(1.15rem,2.2vw,1.8rem)}.stage-card{padding:11px 15px}.stage-card h2{font-size:clamp(.95rem,1.45vw,1.35rem);margin-bottom:3px}.stage-card p,.number,.open-label{font-size:.7rem}.circle{width:30px;height:30px;font-size:1rem}.schedule-logo{height:72px;margin-bottom:8px}.back{min-height:50px;padding:12px 20px}.schedule-top{margin-bottom:14px}.tabs-row{margin:14px 0 12px}.day-tab,.map-btn{padding:11px 18px}.act{min-height:58px;padding:7px 24px}}
  </style>
</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>
<div class="sky-glow" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="shell">
  <main>
    <section id="home">
      <div class="brand-lockup"><img src="assets/starlight-logo-transparent.png" alt="EXIT and P+US present Starlight Festival in partnership with Visa"></div>
      <div class="intro"><h1>Choose your stage</h1></div>
      <div class="stage-grid" id="stageGrid"></div>
    </section>
    <section class="schedule" id="schedule" aria-live="polite">
      <div class="schedule-headbar">
        <button class="back" id="backBtn">← All stages</button>
        <div class="schedule-logo"><img src="assets/starlight-logo-transparent.png" alt="Starlight Festival"></div>
      </div>
      <div class="schedule-top"><div class="stage-title"><p class="eyebrow" id="stageNumber"></p><h1 id="stageName"></h1><p id="stageNote"></p></div></div>
      <div class="tabs-row"><div class="tabs" role="tablist" aria-label="Festival day"><button class="day-tab active" data-day="9" role="tab">Friday · Oct 9</button><button class="day-tab" data-day="10" role="tab">Saturday · Oct 10</button></div><button class="map-btn" id="mapBtn">⌖ Find this stage</button></div>
      <div class="lineup" id="lineup"></div>
    </section>
  </main>
</div>
<section class="map-view" id="mapView" aria-modal="true" role="dialog" aria-labelledby="mapTitle">
  <div class="map-head"><div><h2 id="mapTitle">Find stage</h2><p>The pulsing marker shows your selected stage.</p></div><button class="close-map" id="closeMap">Back to lineup</button></div>
  <div class="map-canvas"><div class="map-inner"><img src="assets/festival-map.png" alt="Starlight Festival venue map"><svg class="route" viewBox="0 0 1000 575" preserveAspectRatio="none" aria-hidden="true"><path id="routePath" d=""></path><g id="footsteps"></g></svg><div class="pin" id="destPin"></div><div class="dest-label" id="destLabel"></div></div></div>
</section>
<script>
const stages={
  main:{name:'The Rise to Starlight',short:'Main Stage',number:'Stage 01',note:'Main Stage · In partnership with Visa',color:'#ff9f1a',map:{x:'58%',y:'46%',lx:'58%',ly:'43%',path:'M392 322 C430 332 458 350 500 354 C530 356 546 332 552 300 C555 280 563 268 580 265'},days:{
    9:[['17:30','Coco & Breezy'],['19:00','Awen B2B Divolly & Markward'],['20:30','Satori'],['21:55','WhoMadeWho · Hybrid DJ Set'],['23:25','Pete Tong B2B Vintage Culture'],['00:55','The Rise to Starlight'],['01:00','Adriatique']],
    10:[['17:30','Avantika'],['18:45','Deer Jade · 10/10 New Moon Set'],['20:15','Cloonee'],['21:45','Michael Bibi'],['23:45','Enrico Sangiuliano'],['01:00','Charlotte de Witte']] }},
  orion:{name:'Orion',short:'Orion Stage',number:'Stage 02',note:'Powered by Coca-Cola',color:'#a879ff',map:{x:'28.6%',y:'47%',lx:'28.6%',ly:'43%',path:'M392 322 C370 340 354 352 330 352 C302 352 288 346 286 320 C284 300 284 282 286 270'},days:{
    9:[['17:30','Akasyon B2B Neo'],['19:00','Tebra'],['20:15','Ziad Mousa B2B Dodge_Ramzz'],['21:30','Nic Mehreeb B2B Moti'],['22:45','Thatgirl Sherryk B2B Mizo Sultan & Riad'],['00:45','Awadly B3B Rolbac B3B Stasi Sanlin']],
    10:[['17:30','F Spins B2B Del Rady'],['18:45','Adham Dou B2B Ahmed Salah'],['19:45','Abou Samra'],['20:45','La Familia'],['22:00','KZ & Cake'],['23:30','Alyssa & Gia'],['01:00','Fiona Kraft B2B Floyd Lavine'],['03:00','Gioli & Assia Live · Starlight Closing']] }},
  nosleep:{name:'No Sleep Giza',short:'No Sleep Giza',number:'Stage 03',note:'Electronic music all night',color:'#ff36d5',map:{x:'88%',y:'37.4%',lx:'88%',ly:'33%',path:'M392 322 C440 330 454 354 500 356 C548 360 588 380 625 378 C650 376 638 330 670 312 C704 294 724 316 756 312 C790 308 820 301 850 301 C872 301 880 286 880 264 L880 215'},days:{
    9:[['17:30','Human Rias B2B Reblok'],['19:00','Valentino'],['20:15','BIIA'],['21:30','Charlie Sparks'],['22:40','Indira Paganotto'],['00:40','Paolo Ferrara B2B Juno'],['02:00','Special B2B']],
    10:[['17:30','Taef B2B Sokkary'],['19:00','Jade B2B Tala'],['20:30','Dish Dash'],['22:00','Ashmawy B2B Coeus'],['23:30','Layla Benitez B2B Lanna'],['01:30','Baset B2B Olympe']] }},
  homeground:{name:'Homeground',short:'Homeground Stage',number:'Stage 04',note:'In partnership with Visa',color:'#c7a4dd',map:{x:'70%',y:'59.1%',lx:'70%',ly:'55%',path:'M392 322 C438 330 458 350 502 355 C545 360 584 378 622 378 C650 378 638 337 658 323 C674 310 688 322 700 340'},days:{
    9:[['18:00','Mash'],['19:00','Yo-Lan-Da'],['20:00','DJ Amira'],['21:00','Dozee'],['22:00','Aren B2B Haytt'],['23:00','Toola'],['00:00','Pikay']],
    10:[['18:00','Mary Khalil'],['19:00','Fouda'],['20:00','Zio'],['21:00','Bou-D B2B Y. Gohar'],['22:00','Hendawy'],['23:00','Kristina Ladyko B2B Lydie The DJette'],['00:00','Fady Mirshak']] }}
};
let current='main',day='9';
const home=document.querySelector('#home'),schedule=document.querySelector('#schedule'),lineup=document.querySelector('#lineup');
const grid=document.querySelector('#stageGrid');
Object.entries(stages).forEach(([id,s])=>{const b=document.createElement('button');b.className='stage-card';b.style.setProperty('--accent',s.color);b.innerHTML=`<span class="number">${s.number}</span><div><h2>${s.short}</h2><p>October 9 & 10</p></div><span class="open-label">View full lineup <span class="circle">+</span></span>`;b.onclick=()=>openStage(id);grid.appendChild(b)});
function openStage(id){current=id;day='9';home.style.display='none';schedule.classList.add('active');document.querySelector('#stageName').textContent=stages[id].name;document.querySelector('#stageNumber').textContent=stages[id].number;document.querySelector('#stageNote').textContent=stages[id].note;schedule.style.setProperty('--stage',stages[id].color);setDay('9');window.scrollTo({top:0,behavior:'smooth'})}
function setDay(d){day=d;document.querySelectorAll('.day-tab').forEach(x=>{const on=x.dataset.day===d;x.classList.toggle('active',on);x.setAttribute('aria-selected',on)});lineup.innerHTML=stages[current].days[d].map(a=>`<div class="act"><div class="time">${a[0]}</div><div class="artist">${a[1]}</div></div>`).join('')}
document.querySelectorAll('.day-tab').forEach(b=>b.onclick=()=>setDay(b.dataset.day));
document.querySelector('#backBtn').onclick=()=>{schedule.classList.remove('active');home.style.display='';window.scrollTo({top:0,behavior:'smooth'})};
function renderRouteGuide(path){const ns='http://www.w3.org/2000/svg',layer=document.querySelector('#footsteps');layer.replaceChildren();const pathData=path.getAttribute('d');const addMotion=(shape,className)=>{shape.setAttribute('class',className);const motion=document.createElementNS(ns,'animateMotion');motion.setAttribute('path',pathData);motion.setAttribute('dur','3.4s');motion.setAttribute('repeatCount','indefinite');shape.append(motion);layer.append(shape)};const halo=document.createElementNS(ns,'circle');halo.setAttribute('r','11');addMotion(halo,'guide-orb-halo');const orb=document.createElementNS(ns,'circle');orb.setAttribute('r','4.5');addMotion(orb,'guide-orb')}
const mapView=document.querySelector('#mapView');document.querySelector('#mapBtn').onclick=()=>{const s=stages[current],m=s.map;document.querySelector('#mapTitle').textContent=`Find ${s.short}`;document.querySelector('#destPin').style.cssText=`--x:${m.x};--y:${m.y}`;document.querySelector('#destLabel').style.cssText=`--lx:${m.lx};--ly:${m.ly}`;document.querySelector('#destLabel').textContent=s.short;const route=document.querySelector('#routePath');route.setAttribute('d',m.path);mapView.classList.add('active');renderRouteGuide(route);document.body.style.overflow='hidden';document.querySelector('#closeMap').focus()};
function closeMap(){mapView.classList.remove('active');document.body.style.overflow='';document.querySelector('#mapBtn').focus()}document.querySelector('#closeMap').onclick=closeMap;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mapView.classList.contains('active'))closeMap()});

const sky=document.querySelector('#starfield'),ctx=sky.getContext('2d');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let stars=[],shooters=[],skyWidth=0,skyHeight=0,dpr=1,lastShot=0;
function seedStars(){
  const count=Math.min(420,Math.floor((skyWidth*skyHeight)/4200));
  stars=Array.from({length:count},(_,i)=>({
    x:Math.random()*skyWidth,y:Math.random()*skyHeight,
    r:Math.random()<.08?Math.random()*1.8+1.1:Math.random()*.95+.25,
    a:Math.random()*.65+.2,p:Math.random()*Math.PI*2,
    s:Math.random()*.0018+.00045,g:i%19===0
  }));
}
function sizeSky(){
  dpr=Math.min(devicePixelRatio||1,2);skyWidth=innerWidth;skyHeight=innerHeight;
  sky.width=Math.floor(skyWidth*dpr);sky.height=Math.floor(skyHeight*dpr);
  sky.style.width=skyWidth+'px';sky.style.height=skyHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);seedStars();
}
function drawStar(star,time){
  const pulse=reduceMotion?star.a:star.a*(.68+.32*Math.sin(time*star.s+star.p));
  ctx.beginPath();ctx.fillStyle=`rgba(255,255,255,${Math.max(.08,pulse)})`;ctx.arc(star.x,star.y,star.r,0,Math.PI*2);ctx.fill();
  if(star.g&&pulse>.45){
    const arm=star.r*5;ctx.strokeStyle=`rgba(255,244,214,${pulse*.42})`;ctx.lineWidth=.65;
    ctx.beginPath();ctx.moveTo(star.x-arm,star.y);ctx.lineTo(star.x+arm,star.y);ctx.moveTo(star.x,star.y-arm);ctx.lineTo(star.x,star.y+arm);ctx.stroke();
  }
}
function animateSky(time=0){
  ctx.clearRect(0,0,skyWidth,skyHeight);stars.forEach(star=>drawStar(star,time));
  if(!reduceMotion&&time-lastShot>6500+Math.random()*4500){shooters.push({x:-120,y:Math.random()*skyHeight*.4,v:11+Math.random()*5,life:0});lastShot=time}
  shooters.forEach(s=>{s.x+=s.v;s.y+=s.v*.34;s.life++;const grad=ctx.createLinearGradient(s.x-105,s.y-36,s.x,s.y);grad.addColorStop(0,'rgba(224,152,31,0)');grad.addColorStop(1,'rgba(255,255,255,.85)');ctx.strokeStyle=grad;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(s.x-105,s.y-36);ctx.lineTo(s.x,s.y);ctx.stroke()});
  shooters=shooters.filter(s=>s.x<skyWidth+140&&s.life<150);
  if(!reduceMotion)requestAnimationFrame(animateSky)
}
addEventListener('resize',sizeSky,{passive:true});sizeSky();animateSky();
</script>
</body>
</html>
